<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Real Estate Flash Cards by Unit</title>
<style>
:root{--navy:#0f172a;--blue:#1d4ed8;--sky:#dbeafe;--gold:#fbbf24;--green:#10b981;--card:#ffffff;--text:#111827;--muted:#64748b;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#f8fafc;color:var(--text)}
.hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;padding:28px 18px}.hero-inner{max-width:1100px;margin:auto}.hero h1{margin:0;font-size:clamp(30px,5vw,58px);line-height:1}.hero p{font-size:18px;color:#dbeafe;max-width:850px}.bar{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #e5e7eb;padding:10px 14px;box-shadow:0 2px 12px #0001}.bar-inner{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-weight:700;background:white}button{cursor:pointer;background:var(--blue);color:white;border-color:var(--blue)}button.secondary{background:white;color:var(--blue)}main{max-width:1100px;margin:auto;padding:20px 14px}.unit{display:none}.unit.active{display:block}.summary{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px #0000000c}.summary h2{margin:0 0 8px;color:var(--navy);font-size:28px}.summary .mission{font-size:18px;color:var(--blue);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.flash{min-height:190px;perspective:1000px;cursor:pointer}.inner{position:relative;width:100%;height:100%;min-height:190px;transition:transform .5s;transform-style:preserve-3d}.flash.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border:1px solid #dbeafe;border-radius:18px;padding:18px;box-shadow:0 8px 22px #00000010;display:flex;flex-direction:column;justify-content:center}.front{border-top:7px solid var(--blue)}.back{transform:rotateY(180deg);border-top:7px solid var(--green);background:#f0fdf4}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:10px}.q{font-size:21px;font-weight:900;line-height:1.18}.a{font-size:18px;line-height:1.28}.tips{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:14px;margin:18px 0;color:#78350f}.navbuttons{display:flex;gap:10px;justify-content:space-between;margin:20px 0}.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}.toc button{text-align:left;background:#eff6ff;color:#1e3a8a;border-color:#bfdbfe}.print{margin-left:auto}@media print{.bar,.navbuttons,.tips button{display:none}.unit{display:block;page-break-before:always}.flash{break-inside:avoid}.inner,.flash.flipped .inner{transform:none}.face{position:relative;margin-bottom:8px}.back{transform:none}.grid{grid-template-columns:1fr 1fr}.hero{background:white;color:#111;border-bottom:2px solid #111}.hero p{color:#333}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><h1>Real Estate Flash Cards</h1><p>Modern Real Estate Practice review, organized unit by unit with a high-level chapter summary first, then clickable flash cards. Tap any card to reveal the answer.</p><div class="toc" id="toc"></div></div></header>
<div class="bar"><div class="bar-inner"><strong>Jump to unit:</strong><select id="unitSelect"></select><button onclick="showUnit(+unitSelect.value)">Go</button><button class="secondary" onclick="flipAll(false)">Show Fronts</button><button class="secondary" onclick="flipAll(true)">Show Answers</button><button class="secondary print" onclick="window.print()">Print / Save PDF</button></div></div>
<main id="app"></main>
<script>
const units = [
{n:1,t:'Introduction to the Real Estate Business',mission:'Understand the major careers, services, and market forces in real estate.',summary:['Real estate is both a product and a service business.','Brokerage, appraisal, financing, property management, development, investment, and counseling all support transactions.','Value is local and driven by supply, demand, location, and economic conditions.'],cards:[['What is brokerage?','The business of bringing parties together in a real estate transaction.'],['What does an appraiser do?','Estimates or gives an opinion of property value.'],['What is property management?','Operating and managing property for an owner.'],['What is demand?','The desire and ability of buyers or tenants to acquire property.'],['Why are real estate markets local?','Because location, jobs, amenities, supply, demand, and neighborhood conditions affect value.']]},
{n:2,t:'Real Property and the Law',mission:'Separate land, real estate, real property, personal property, and fixtures.',summary:['Land is the earth plus natural attachments.','Real estate is land plus permanent improvements.','Real property includes legal ownership rights.','Fixture questions depend on attachment and intent.'],cards:[['What is real estate?','Land plus permanent human-made improvements.'],['What is real property?','Real estate plus legal ownership rights.'],['What is personal property?','Movable property not permanently attached to land.'],['What is a fixture?','Personal property that became real property by attachment and intent.'],['What is a trade fixture?','Tenant business property that may remain personal property if removed properly.'],['What is the bundle of legal rights?','Rights to possess, control, enjoy, exclude, and dispose of property.']]},
{n:3,t:'Interests in Real Estate',mission:'Know estates, encumbrances, easements, liens, and government powers.',summary:['Fee simple is the broadest ownership.','Life estates last for a lifetime.','Encumbrances limit or affect title/use.','Government powers include police power, eminent domain, taxation, and escheat.'],cards:[['What is fee simple?','The broadest and strongest ownership estate.'],['What is a life estate?','Ownership lasting for the lifetime of a named person.'],['What is an easement?','A right to use another person’s land for a specific purpose.'],['What is a lien?','A claim against property as security for debt or obligation.'],['What is eminent domain?','Government power to take private property for public use with compensation.'],['What is escheat?','Property transfers to the state when an owner dies without heirs or a will.']]},
{n:4,t:'Forms of Real Estate Ownership',mission:'Understand individual, co-ownership, business, and community forms of ownership.',summary:['Severalty means one owner.','Tenancy in common allows unequal shares and inheritance.','Joint tenancy commonly includes survivorship.','Condos, co-ops, trusts, partnerships, corporations, and LLCs structure ownership differently.'],cards:[['What is severalty?','Ownership by one person or one legal entity.'],['What is tenancy in common?','Co-ownership with possible unequal shares and inheritance by heirs.'],['What is joint tenancy?','Co-ownership usually involving right of survivorship.'],['What is right of survivorship?','A deceased owner’s share passes automatically to surviving co-owner(s).'],['What is a condominium?','Individual unit ownership plus shared common elements.'],['What is a cooperative?','Residents own shares in a corporation and receive occupancy rights.']]},
{n:5,t:'Land Description',mission:'Learn how exact land parcels are legally identified.',summary:['Street addresses are not enough for most deeds.','Metes and bounds uses directions, distances, and monuments.','Rectangular survey uses baselines, meridians, townships, ranges, and sections.','Lot and block is common in subdivisions.'],cards:[['What is a legal description?','A precise description identifying a specific parcel of land.'],['What is metes and bounds?','A description using distances, directions, and monuments.'],['What is the point of beginning?','The starting and ending point in a metes-and-bounds description.'],['What is the rectangular survey system?','A system using baselines, meridians, townships, ranges, and sections.'],['What is lot and block?','A description method using subdivision plat maps.']]},
{n:6,t:'Transfer of Title',mission:'Know how ownership transfers and what deeds do.',summary:['Title is ownership. A deed transfers ownership.','Valid deeds require key elements such as grantor, grantee, legal description, conveyance words, signature, delivery, and acceptance.','General warranty gives strongest protection, quitclaim gives the least.'],cards:[['What is title?','Legal ownership of property.'],['What is a deed?','A written instrument used to transfer real property ownership.'],['Who is the grantor?','The person transferring property.'],['Who is the grantee?','The person receiving property.'],['What is a general warranty deed?','A deed giving the strongest warranties and buyer protection.'],['What is a quitclaim deed?','A deed transferring whatever interest the grantor may have, with no warranties.']]},
{n:7,t:'Title Records',mission:'Understand recording, public notice, chain of title, and title insurance.',summary:['Recording gives public notice.','Chain of title tracks ownership history.','Clouds on title can threaten marketability.','Title insurance protects against certain past title defects.'],cards:[['What is recording?','Placing documents in public records to provide notice.'],['What is constructive notice?','Legal notice created by public record availability.'],['What is chain of title?','The history of ownership transfers for a property.'],['What is a cloud on title?','A possible defect or claim affecting ownership.'],['What is title insurance?','Insurance protecting against certain past title defects.']]},
{n:8,t:'Real Estate Brokerage',mission:'Know broker supervision, compensation, and antitrust red flags.',summary:['Brokers supervise brokerage activity.','Commissions are negotiable.','Antitrust violations include price-fixing, market allocation, group boycotts, and tying arrangements.'],cards:[['Who is a broker?','A licensed person responsible for brokerage activity and supervision.'],['What is commission?','Negotiable compensation paid according to agreement.'],['What phrase should agents avoid?','“Standard commission.” Commissions are negotiable.'],['What is price-fixing?','Competitors agreeing to set prices or commission rates.'],['What is a group boycott?','Competitors agreeing not to deal with another party.']]},
{n:9,t:'Real Estate Agency',mission:'Master agency relationships, fiduciary duties, clients, and customers.',summary:['Agency is a fiduciary relationship.','Client duties include loyalty, obedience, disclosure, confidentiality, accounting, and reasonable care.','Customers are treated honestly but are not represented the same way as clients.'],cards:[['What is agency?','A fiduciary relationship where an agent represents a principal/client.'],['What is loyalty?','Duty to put the client’s interests first.'],['What is confidentiality?','Duty to protect client secrets.'],['What is disclosure?','Duty to reveal important information to the client.'],['What is dual agency?','One brokerage/agent representing both sides if legal and properly disclosed.'],['Who is a customer?','Someone treated honestly but not represented as a client.']]},
{n:10,t:'Client Representation Agreements',mission:'Know listing and buyer representation agreement types.',summary:['Listing agreements employ a broker to represent a seller.','Exclusive right-to-sell is strongest for broker compensation.','Exclusive agency allows seller to avoid commission if seller personally finds buyer.','Open listings are nonexclusive.'],cards:[['What is a listing agreement?','An employment contract between seller and broker.'],['What is exclusive right to sell?','Broker earns commission if property sells during the listing period.'],['What is exclusive agency?','Broker is exclusive, but seller may avoid commission by finding buyer personally.'],['What is an open listing?','Nonexclusive listing where only the procuring broker gets paid.'],['What is a net listing?','Broker keeps amount above seller’s required price, risky and often restricted.']]},
{n:11,t:'Real Estate Contracts',mission:'Understand valid contract elements and contract status terms.',summary:['Valid contracts require offer/acceptance, consideration, capacity, legal purpose, and consent.','Executed means fully performed, executory means not fully performed.','Void has no legal effect, voidable may be canceled by one party.'],cards:[['What is a contract?','A promise or agreement the law may enforce.'],['What are offer and acceptance?','Mutual agreement between parties.'],['What is consideration?','Something of legal value exchanged.'],['What is an executed contract?','A fully performed contract.'],['What is a voidable contract?','A contract one party may cancel due to a legal issue.'],['What is a contingency?','A condition that must be satisfied or waived.']]},
{n:12,t:'Real Estate Financing',mission:'Know notes, mortgages, interest, amortization, LTV, default, and foreclosure.',summary:['The note is the promise to repay.','The mortgage or deed of trust secures the loan with property.','LTV equals loan amount divided by value or price.','Foreclosure enforces the lien after default.'],cards:[['What is a promissory note?','Borrower’s written promise to repay a loan.'],['What is a mortgage?','Security instrument pledging property as collateral for a loan.'],['What is interest?','The cost of borrowing money.'],['What is amortization?','Repayment of debt over time through scheduled payments.'],['What is LTV?','Loan amount divided by value or price.'],['What is foreclosure?','Legal process to enforce a lien after default.']]},
{n:13,t:'Government Involvement in Real Estate Financing',mission:'Know FHA, VA, USDA, conventional loans, and secondary mortgage market.',summary:['FHA insures loans. VA guarantees eligible veteran loans.','Conventional loans are not government-insured or guaranteed.','The secondary mortgage market lets lenders sell loans and replenish funds.'],cards:[['What does FHA do?','Insures approved mortgage loans.'],['What does VA do?','Guarantees eligible veteran loans.'],['What is a conventional loan?','A loan not government-insured or government-guaranteed.'],['What is the secondary mortgage market?','Market where loans are bought and sold after origination.'],['What is TILA?','Truth in Lending Act, requiring credit cost disclosures.'],['What is RESPA?','Law requiring settlement cost disclosures and regulating certain closing practices.']]},
{n:14,t:'Closing the Real Estate Transaction',mission:'Understand closing, settlement statements, debits, credits, and prorations.',summary:['Closing transfers ownership and settles funds.','Debit means charge, credit means amount in favor.','Prorations divide expenses fairly based on time owned or occupied.'],cards:[['What is closing?','Final settlement where ownership transfers and funds are distributed.'],['What is a debit?','A charge to a party.'],['What is a credit?','An amount in favor of a party.'],['What is proration?','Dividing expenses between buyer and seller by time.'],['Unpaid seller taxes are usually what?','Seller debit and buyer credit.']]},
{n:15,t:'Real Estate Taxes and Other Liens',mission:'Know lien types, taxes, assessments, and priority basics.',summary:['A lien is a claim against property.','Voluntary liens are created by agreement, involuntary liens arise by law.','Specific liens affect one property, general liens may affect all property.'],cards:[['What is a lien?','Claim against property as security for debt or obligation.'],['What is a voluntary lien?','Lien created by agreement, such as a mortgage.'],['What is an involuntary lien?','Lien created by law, such as tax or judgment lien.'],['What is a mechanic’s lien?','Lien for unpaid labor or materials improving property.'],['What is millage rate?','Tax rate used to calculate property taxes.']]},
{n:16,t:'Real Estate Appraisal',mission:'Know value, appraisal approaches, and valuation principles.',summary:['Market value is the most probable price under normal conditions.','Sales comparison is common for homes.','Income approach fits income property.','Cost approach fits new or special-purpose property.'],cards:[['What is an appraisal?','Opinion or estimate of property value.'],['What is market value?','Most probable price under normal market conditions.'],['What is sales comparison approach?','Valuation using comparable sold properties.'],['What is income approach?','Value based on income the property produces.'],['What is cost approach?','Land plus improvement cost minus depreciation.'],['What is substitution?','Buyer will not pay more than the cost of a comparable substitute.']]},
{n:17,t:'Leases',mission:'Understand leasehold estates, rent structures, assignment, and sublease.',summary:['Leases give possession and use, not ownership.','Estate for years has a definite end date.','Periodic tenancy renews automatically.','Assignment transfers all remaining rights, sublease transfers less.'],cards:[['What is a lease?','Contract giving possession and use of property, not ownership.'],['Who is the lessor?','Landlord or owner granting lease rights.'],['What is estate for years?','Leasehold with a definite ending date.'],['What is periodic tenancy?','Tenancy that renews automatically for periods until notice.'],['What is a percentage lease?','Rent plus a percentage of business sales.'],['Assignment vs sublease?','Assignment transfers all remaining rights, sublease transfers less than all rights.']]},
{n:18,t:'Fair Housing',mission:'Memorize protected classes and prohibited practices.',summary:['Federal protected classes are race, color, religion, sex, disability, familial status, and national origin.','Illegal practices include steering, blockbusting, redlining, and discriminatory advertising.','Reasonable accommodation/modification rules matter for disability.'],cards:[['What are the federal protected classes?','Race, color, religion, sex, disability, familial status, and national origin.'],['What is steering?','Directing people toward or away from areas based on protected class.'],['What is blockbusting?','Inducing panic selling by suggesting protected-class changes.'],['What is redlining?','Discriminatory denial or limitation of loans/services in certain areas.'],['What is reasonable accommodation?','Rule or policy change needed for disability-related use/enjoyment.']]},
{n:19,t:'Property Management',mission:'Understand manager duties, budgets, rent rolls, maintenance, and trust accounts.',summary:['Property managers operate property for owners.','Management agreements define authority and compensation.','Managers handle budgets, leases, rent, maintenance, tenant relations, reporting, and legal compliance.'],cards:[['What is property management?','Operating property for an owner.'],['What is a management agreement?','Contract defining manager authority, duties, and compensation.'],['What is a rent roll?','List of units, tenants, rent amounts, and lease details.'],['What is preventive maintenance?','Maintenance done before equipment fails.'],['What is a trust account?','Account holding client or tenant funds separately.']]},
{n:20,t:'Land-Use Controls and Property Development',mission:'Know zoning, master plans, variances, nonconforming use, and private controls.',summary:['Zoning is government land-use control through police power.','Variances allow hardship exceptions.','Legal nonconforming uses existed legally before zoning changed.','Deed restrictions are private controls.'],cards:[['What is zoning?','Government regulation of land use and development.'],['What is a master plan?','Long-term plan guiding community growth and land use.'],['What is a variance?','Permission for zoning exception due to hardship.'],['What is legal nonconforming use?','Use that was legal before zoning changed and may continue under rules.'],['Public vs private control?','Zoning is public, deed restrictions/covenants are private.']]},
{n:21,t:'Environmental Issues and the Real Estate Transaction',mission:'Recognize hazards, liability, disclosure issues, and when to recommend experts.',summary:['Environmental issues affect value, safety, financing, and liability.','Common hazards include lead paint, asbestos, radon, mold, tanks, wetlands, and hazardous waste.','Agents should disclose known facts, avoid diagnosis, and recommend qualified experts.'],cards:[['What is the EPA?','Environmental Protection Agency.'],['What is CERCLA/Superfund?','Federal law addressing hazardous waste cleanup liability.'],['What is lead-based paint concern?','Homes built before 1978 may require disclosure and procedures.'],['What is radon?','Naturally occurring gas that can enter buildings from the ground.'],['What is a Phase I environmental site assessment?','Environmental due diligence review often used for commercial property.'],['Agent rule for environmental concerns?','Disclose known facts, do not diagnose, recommend qualified experts.']]}
];
const app=document.getElementById('app'), sel=document.getElementById('unitSelect'), toc=document.getElementById('toc');
units.forEach((u,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`Unit ${u.n}: ${u.t}`;sel.appendChild(o);let b=document.createElement('button');b.textContent=`Unit ${u.n}: ${u.t}`;b.onclick=()=>showUnit(i);toc.appendChild(b);});
function render(){app.innerHTML=units.map((u,i)=>`<section class="unit" id="unit${i}"><div class="summary"><h2>Unit ${u.n} — ${u.t}</h2><div class="mission">${u.mission}</div><h3>High-Level Chapter Summary</h3><ul>${u.summary.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="grid">${u.cards.map((c,j)=>`<div class="flash" onclick="this.classList.toggle('flipped')"><div class="inner"><div class="face front"><div class="tag">Unit ${u.n} · Card ${j+1} · Front</div><div class="q">${c[0]}</div></div><div class="face back"><div class="tag">Unit ${u.n} · Card ${j+1} · Back</div><div class="a">${c[1]}</div></div></div></div>`).join('')}</div><div class="navbuttons"><button class="secondary" onclick="showUnit(Math.max(0,${i-1}))">Previous Unit</button><button onclick="showUnit(Math.min(units.length-1,${i+1}))">Next Unit</button></div></section>`).join('');}
function showUnit(i){document.querySelectorAll('.unit').forEach(x=>x.classList.remove('active'));document.getElementById('unit'+i).classList.add('active');sel.value=i;window.scrollTo({top:0,behavior:'smooth'});} 
function flipAll(show){document.querySelectorAll('.unit.active .flash').forEach(c=>c.classList.toggle('flipped',show));}
render();showUnit(0);
</script>
</body>
</html>
